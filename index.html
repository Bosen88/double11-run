<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>雙十一購物狂奔</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#7a0c1c;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:#fbe9d0}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px;text-align:center;background:linear-gradient(rgba(140,10,30,.55),rgba(90,5,20,.82)),var(--bg) center/cover;z-index:5}
.hidden{display:none!important}
h1{font-size:36px;line-height:1.15;color:#ffd96a;text-shadow:0 3px 0 #a3001b,0 6px 14px rgba(0,0,0,.4);letter-spacing:2px}
.tag{display:inline-block;background:#ffd96a;color:#a3001b;font-weight:800;padding:4px 12px;border-radius:999px;font-size:14px;margin-bottom:8px}
.card{background:rgba(255,248,235,.96);color:#5a1010;border-radius:18px;padding:12px 14px;margin:12px 0;width:100%;max-width:360px;box-shadow:0 6px 0 #b8860b,0 10px 24px rgba(0,0,0,.3);border:3px solid #ffd96a;text-align:left;font-size:14px;line-height:1.55}
.card b{color:#c8102e}
.items{display:flex;flex-wrap:wrap;justify-content:space-between;margin:2px 0 8px}
.items div{display:flex;flex-direction:column;align-items:center;font-size:11px;width:33%;line-height:1.3;text-align:center;margin:4px 0}
.items img{height:36px;object-fit:contain;margin-bottom:2px}
.btn{appearance:none;border:none;background:linear-gradient(#ffe27a,#f5b800);color:#9b0018;font-size:24px;font-weight:900;padding:14px 46px;border-radius:999px;box-shadow:0 6px 0 #a86f00,0 10px 20px rgba(0,0,0,.35);cursor:pointer;letter-spacing:2px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a86f00}
.btn.sm{font-size:17px;padding:10px 26px;margin-top:10px}
.status{font-size:13px;margin-top:8px;opacity:.95}
input{font-size:16px;padding:8px 12px;border-radius:10px;border:2px solid #ffd96a;width:100%;margin-top:6px;color:#5a1010}
.big{font-size:48px;font-weight:900;color:#c8102e;line-height:1}
.row{display:flex;justify-content:space-between;margin:3px 0}
.center{text-align:center}
.prize{background:#c8102e;color:#fff;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.5}
.prize b{color:#ffd96a}
#endScr{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:28px}
.break{margin-top:8px;border-top:1px dashed #e0b84a;padding-top:6px}
.break .hd{font-size:12px;font-weight:800;color:#c8102e;margin-bottom:2px}
.break .it{display:grid;grid-template-columns:28px 1fr;column-gap:8px;align-items:start;margin:5px 0;font-size:12px;line-height:1.35}
.break .it img{width:28px;height:28px;object-fit:contain}
.break .it .nm{font-weight:800}
.break .it .line{display:block;font-weight:500;color:#7a3030;font-size:11px;margin-top:1px}
.break .it .miss{color:#9a7a7a;font-weight:500}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;z-index:3;pointer-events:none}
.pill{background:rgba(160,0,25,.88);border:2px solid #ffd96a;border-radius:999px;padding:4px 12px;font-weight:800;font-size:16px;min-width:84px;text-align:center}
#slowTip{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#ffd96a;color:#a3001b;font-weight:900;padding:4px 14px;border-radius:999px;z-index:3;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="game">
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div class="pill" id="hScore">0 分</div><div class="pill" id="hTime">60.0 秒</div><div class="pill" id="hDist">0 m</div></div>
<div id="slowTip" class="hidden">碰到限量！減速中…</div>

<div class="screen" id="startScr">
  <div class="tag">11.11 限時活動</div>
  <h1>雙十一<br>購物狂奔</h1>
  <div class="card">
    <div class="items">
      <div><img id="iEnzyme" alt="">消化酵素<br>+10</div>
      <div><img id="iBromelain" alt="">鳳梨酵素<br>+20</div>
      <div><img id="iDaily" alt="">每日精選<br>+30</div>
      <div><img id="iJelly" alt="">NAD+果凍<br>+40</div>
      <div><img id="iCream" alt="">NAD青春霜<br>+50</div>
      <div><img id="iL" alt=""><b>限量</b><br>會減速</div>
    </div>
    <div>👉 <b>左右滑動</b>或<b>點畫面左右邊</b>換跑道</div>
    <div>🛒 撿商品得分，跑越遠分數越高</div>
    <div>⏱ 每局 <b>60 秒</b>，越跑越快！</div>
    <div>暱稱（會顯示在成績上）：<input id="nick" maxlength="12" placeholder="例：小美"></div>
  </div>
  <button class="btn" id="startBtn">開始遊戲</button>
  <div class="status" id="evStatus"></div>
</div>

<div class="screen hidden" id="endScr">
  <h1 style="font-size:28px">時間到！</h1>
  <div class="card">
    <div class="center" id="eNick" style="font-weight:800"></div>
    <div class="center" style="margin-top:2px">總分</div>
    <div class="center big" id="eScore">0</div>
    <div class="row" style="margin-top:6px"><span>跑步距離</span><b id="eDist">0 m</b></div>
    <div class="row"><span>撿到商品</span><b id="eItems">0 件</b></div>
    <div class="row"><span>碰到限量</span><b id="eHits">0 次</b></div>
    <div class="row"><span>我的最佳</span><b id="eBest">0</b></div>
    <div class="center" style="font-size:12px;opacity:.7" id="eTime"></div>
    <div id="eBreak" class="break"></div>
    <div class="prize">📸 請<b>截圖這個畫面</b>，貼到 LINE 群組回報成績！<br>排行榜<b>前三名</b>可得 <b>小禮物一份＋健康大禮包</b>，得獎者會收到私訊通知。</div>
  </div>
  <button class="btn" id="againBtn">再玩一次</button>
</div>
</div></div>

const PRODUCT=[
  {k:'jelly',name:'NAD+果凍',line:'吃了 NAD+果凍，由內而外散發年輕光采！✨'},
  {k:'enzyme',name:'消化酵素',line:'消化酵素補起來，腸道順暢好健康！💪'},
  {k:'daily',name:'每日精選',line:'每日精選顧全面，每天都元氣滿滿！🌞'},
  {k:'bromelain',name:'鳳梨酵素',line:'鳳梨酵素來幫忙，消化代謝都輕盈！🍍'},
  {k:'cream',name:'NAD青春霜',line:'擦上 NAD青春霜，肌膚水嫩好年輕！💖'}
];
const $=id=>document.getElementById(id);
const imgs={};let loaded=0;const keys=Object.keys(IMG);
keys.forEach(k=>{const im=new Image();im.onload=()=>{loaded++};im.src=IMG[k];imgs[k]=im});
$('iEnzyme').src=IMG.enzyme;$('iBromelain').src=IMG.bromelain;$('iDaily').src=IMG.daily;
$('iJelly').src=IMG.jelly;$('iCream').src=IMG.cream;$('iL').src=IMG.limited;
document.querySelectorAll('.screen').forEach(s=>s.style.setProperty('--bg',`url(${IMG.bg})`));

const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){const r=$('game').getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// 活動時間（台北時間）——只顯示，不鎖定
function taipeiNow(){const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000)}
function fmt(d){const p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function evState(){const t=taipeiNow(),y=t.getFullYear(),s=new Date(y,10,11,11,11),e=new Date(y,10,11,21,11);return t<s?'before':t>e?'after':'live'}
function updStatus(){const st=evState();$('evStatus').textContent=st==='live'?'🔥 活動進行中！成績截圖即可參加排行榜':st==='before'?'活動 11/11 11:11 開始，現在可先練習 💪':'本次活動已結束，歡迎繼續練習 😊'}
updStatus();setInterval(updStatus,30000);

const LANES=3,DUR=60;
const TYPES={enzyme:{pts:10,w:.55},bromelain:{pts:20,w:.55},daily:{pts:30,w:.6},jelly:{pts:40,w:.55},cream:{pts:50,w:.55},limited:{pts:0,w:.7}};
let st,running=false,last=0,best=+(safeGet('d11best')||0);
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
$('nick').value=safeGet('d11nick')||'';
function laneX(i){const l=W*.24,r=W*.76;return l+(r-l)*(i+.5)/LANES}
function laneW(){return (W*.52)/LANES}
function reset(){st={t:0,score:0,dist:0,items:0,hits:0,lane:1,px:laneX(1),speed:0,slow:0,inv:0,objs:[],spawn:0,scroll:0,fx:[],shake:0,got:{jelly:0,enzyme:0,daily:0,bromelain:0,cream:0}}}
function start(){safeSet('d11nick',$('nick').value.trim());reset();running=true;$('startScr').classList.add('hidden');$('endScr').classList.add('hidden');$('hud').classList.remove('hidden');last=performance.now()}
function fillBreak(){
  $('eBreak').innerHTML='<div class="hd">本局撿到</div>'+PRODUCT.map(p=>{
    const n=st.got[p.k]||0, pts=n*TYPES[p.k].pts;
    const extra=n>=1?`<span class="line">${p.line}</span>`:`<span class="miss">下次記得撿喔～</span>`;
    return `<div class="it"><img src="${IMG[p.k]}" alt=""><div><span class="nm">${p.name}</span> ×${n}${n?('　+'+pts):''} ${extra}</div></div>`;
  }).join('');
}
function end(){running=false;$('hud').classList.add('hidden');$('slowTip').classList.add('hidden');
  const total=st.score+Math.floor(st.dist);if(total>best){best=total;safeSet('d11best',best)}
  const n=$('nick').value.trim();$('eNick').textContent=n?`玩家：${n}`:'';
  $('eScore').textContent=total;$('eDist').textContent=Math.floor(st.dist)+' m';$('eItems').textContent=st.items+' 件（'+st.score+' 分）';
  $('eHits').textContent=st.hits+' 次';$('eBest').textContent=best;$('eTime').textContent='完成時間（台北）'+fmt(taipeiNow());
  fillBreak();
  $('endScr').classList.remove('hidden')}
function move(d){if(!running)return;st.lane=Math.max(0,Math.min(LANES-1,st.lane+d))}
$('startBtn').onclick=start;$('againBtn').onclick=start;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);else if(e.key==='ArrowRight'||e.key==='d')move(1);else if((e.key===' '||e.key==='Enter')&&!running){start();e.preventDefault()}});
let tx=null,ty=null,tt=0;
cv.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;tt=performance.now()});
cv.addEventListener('pointerup',e=>{if(tx===null)return;const dx=e.clientX-tx;const r=cv.getBoundingClientRect();
  if(Math.abs(dx)>25)move(dx>0?1:-1);else move(e.clientX-r.left<r.width/2?-1:1);tx=null});

function spawn(){const lane=Math.floor(Math.random()*LANES);const r=Math.random();const p=Math.min(st.t/DUR,1);
  let type;if(r<.28+.12*p)type='limited';else{const r2=Math.random();type=r2<.28?'enzyme':r2<.50?'bromelain':r2<.70?'daily':r2<.87?'jelly':'cream'}
  st.objs.push({type,lane,y:-60,hit:false})}
function update(dt){st.t+=dt;if(st.t>=DUR){st.t=DUR;end();return}
  const base=H*(.45+.55*st.t/DUR);st.slow=Math.max(0,st.slow-dt);st.inv=Math.max(0,st.inv-dt);st.shake=Math.max(0,st.shake-dt);
  st.speed=base*(st.slow>0?.4:1);st.scroll+=st.speed*dt;st.dist+=st.speed*dt/(H/12);
  st.px+= (laneX(st.lane)-st.px)*Math.min(1,dt*16);
  st.spawn-=st.speed*dt;if(st.spawn<=0){spawn();st.spawn=H*(.22+Math.random()*.16)}
  const py=H*.8,lw=laneW();
  for(const o of st.objs){o.y+=st.speed*dt;
    if(!o.hit&&o.lane===st.lane&&Math.abs(o.y-py)<lw*.55&&Math.abs(laneX(o.lane)-st.px)<lw*.6){
      if(o.type==='limited'){if(st.inv<=0){o.hit=true;st.hits++;st.slow=1.6;st.inv=1.2;st.shake=.3;fxText('限量！減速','#fff',o)}}
      else{o.hit=true;st.items++;st.score+=TYPES[o.type].pts;st.got[o.type]=(st.got[o.type]||0)+1;fxText('+'+TYPES[o.type].pts,'#ffd96a',o)}}}
  st.objs=st.objs.filter(o=>o.y<H+80&&!(o.hit&&o.type!=='limited'));
  st.fx.forEach(f=>{f.y-=60*dt;f.a-=dt*1.4});st.fx=st.fx.filter(f=>f.a>0);
  $('hScore').textContent=(st.score+Math.floor(st.dist))+' 分';$('hTime').textContent=(DUR-st.t).toFixed(1)+' 秒';$('hDist').textContent=Math.floor(st.dist)+' m';
  $('slowTip').classList.toggle('hidden',st.slow<=0)}
function fxText(s,c,o){st.fx.push({s,c,x:laneX(o.lane),y:H*.72,a:1})}
function drawImg(im,x,y,size){if(!im.complete||!im.naturalWidth)return;const s=size/Math.max(im.naturalWidth,im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;ctx.drawImage(im,x-w/2,y-h/2,w,h)}
function drawBg(){const im=imgs.bg;if(im.naturalWidth){const s=Math.max(W/im.naturalWidth,H/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h)}else{ctx.fillStyle='#fbe9d0';ctx.fillRect(0,0,W,H)}
  const l=W*.24,r=W*.76;ctx.fillStyle='rgba(255,245,225,.55)';ctx.fillRect(l,0,r-l,H);
  const gap=H/8,off=(st?st.scroll:0)%gap;ctx.strokeStyle='rgba(200,150,90,.35)';ctx.lineWidth=2;
  for(let y=off-gap;y<H;y+=gap){ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke()}
  ctx.setLineDash([18,18]);ctx.lineDashOffset=-(st?st.scroll:0);ctx.strokeStyle='rgba(200,16,46,.35)';ctx.lineWidth=3;
  for(let i=1;i<LANES;i++){const x=l+(r-l)*i/LANES;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);
  ctx.strokeStyle='#ffd96a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(l,0);ctx.lineTo(l,H);ctx.moveTo(r,0);ctx.lineTo(r,H);ctx.stroke()}
function draw(){ctx.save();if(st&&st.shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*6);drawBg();
  if(st){const lw=laneW();
    for(const o of st.objs){const x=laneX(o.lane);const sz=lw*TYPES[o.type].w*1.5;
      ctx.globalAlpha=o.hit?.45:1;drawImg(imgs[o.type],x,o.y,sz);ctx.globalAlpha=1}
    const py=H*.8,blink=st.inv>0&&Math.floor(st.inv*10)%2===0;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(st.px,py+lw*.45,lw*.42,lw*.1,0,0,7);ctx.fill();
    if(!blink)drawImg(imgs.char,st.px,py+Math.sin(st.t*18)*3,lw*1.25);
    for(const f of st.fx){ctx.globalAlpha=Math.max(0,f.a);ctx.font='900 24px sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#a3001b';ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y)}ctx.globalAlpha=1}
  ctx.restore()}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__d11={start,end,move,get state(){return st}};
